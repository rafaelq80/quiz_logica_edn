<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz: Classificando variáveis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--bg:#f2f5fa;--card:#fff;--ink:#162036;--muted:#5a6781;--acc:#0e8f7e;--accink:#fff;--ok:#17803d;--okbg:#e3f6ea;--bad:#c2371f;--badbg:#fdeae6;--line:#d5dcea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--ink:#eaf0fb;--muted:#9fb0cf;--acc:#38c9b4;--accink:#06211c;--ok:#4cd388;--okbg:#12301f;--bad:#ff8a73;--badbg:#3a1d19;--line:#2b3a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18223a;--ink:#eaf0fb;--muted:#9fb0cf;--acc:#38c9b4;--accink:#06211c;--ok:#4cd388;--okbg:#12301f;--bad:#ff8a73;--badbg:#3a1d19;--line:#2b3a5c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px;font-weight:800}
.sub{color:var(--muted);margin:0 0 18px}
.rail{display:flex;align-items:center;margin:0 0 18px}
.rail i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;font:800 11px/1 Nunito,sans-serif;font-style:normal;color:var(--muted)}
.rail i.done{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.rail i.now{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.rail b{height:2px;flex:1;background:var(--line)}
.rail b.done{background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h2{margin:0 0 6px;font-size:1.2rem;font-weight:800}
.seq{font:800 1.5rem/1.3 Nunito,sans-serif;letter-spacing:.04em;margin:14px 0;padding:12px 14px;border-radius:10px;background:var(--bg);overflow-wrap:anywhere}
.seq em{color:var(--acc);font-style:normal}
.boxes{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.boxes span{border:2px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:800}
.boxes span b{color:var(--acc)}
input[type=text],textarea{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:800 1rem Nunito,sans-serif;cursor:pointer;border-radius:10px;border:2px solid var(--acc);padding:10px 18px;background:var(--acc);color:var(--accink)}
button.ghost{background:transparent;color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
ol.ord{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
ol.ord li{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
ol.ord li .n{width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
ol.ord li .t{flex:1}
ol.ord li.drag{opacity:.4}
ol.ord li.ok{border-color:var(--ok);background:var(--okbg)}
ol.ord li.no{border-color:var(--bad);background:var(--badbg)}
.mv{display:flex;gap:4px}
.mv button{padding:4px 9px;font-size:.9rem;background:transparent;color:var(--acc);border-width:1px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:5px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.no{background:var(--badbg);border-color:var(--bad)}
.fb.info{background:var(--bg);border-color:var(--acc)}
.fb p{margin:4px 0 0}
.big{font:800 3rem/1 Nunito,sans-serif;color:var(--acc);margin:6px 0}
.rev{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px}
.rev li{display:flex;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.rev .ic{font-weight:800}
.rev .ok{color:var(--ok)}.rev .no{color:var(--bad)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--card)}
.opt input{margin-top:6px;accent-color:var(--acc)}
.opt:has(input:checked):not(.ok):not(.no){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg);opacity:.75}
.wl{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.wl span{border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:700;font-size:.9rem}
.wl span.f{text-decoration:line-through;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:8px 0}
.grid .cell{aspect-ratio:1;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:800 clamp(.75rem,3.3vw,1.05rem) Nunito,sans-serif;display:grid;place-items:center}
.grid .cell.on{outline:3px solid var(--acc);outline-offset:-2px}
.wm{color:var(--muted);min-height:1.5em;margin:4px 0 0;font-size:.95rem}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
</style>
</head>
<body>
<main>
<h1>Classificando variáveis</h1>
<p class="sub">Identifique o tipo de cada variável. Você tem até 2 tentativas por questão.</p>
<div class="rail" id="rail" aria-hidden="true"></div>
<div class="card" id="card" aria-live="polite"></div>
</main>
<script>
const OP=["Qualitativa nominal","Qualitativa ordinal","Quantitativa discreta","Quantitativa contínua"];
const TAIL=["É uma categoria sem ordem natural: qualitativa nominal.","É uma categoria com ordem natural: qualitativa ordinal.","É uma contagem, com valores inteiros: quantitativa discreta.","É uma medida, que pode assumir qualquer valor num intervalo: quantitativa contínua."];
const H="primeiro veja se os valores são categorias (palavras) ou números. Categorias: existe uma ordem entre elas? Números: são contados (inteiros) ou medidos (podem ter casas decimais)?";
const v=(n,nome,vals,a,m)=>({k:"choice",title:"Variável "+n,text:"Qual é o tipo desta variável?",v:nome,defs:["<b>Variável:</b> "+nome,"<b>Valores possíveis:</b> "+vals],opts:OP,a,fixed:1,h:H,exp:nome+": "+m+" "+TAIL[a]});
const Q=[
v(1,"Cor dos olhos","castanho, verde, azul",0,"cores são categorias, sem ordem entre elas."),
v(2,"Nível de escolaridade","médio, superior, pós",1,"médio, superior e pós são categorias que seguem uma ordem de nível."),
v(3,"Número de irmãos","0, 1, 2, 3…",2,"os irmãos são contados: 0, 1, 2, 3…"),
v(4,"Altura","1,62 m; 1,75 m…",3,"a altura é medida e pode ter qualquer valor entre dois números (1,62 m; 1,75 m; 1,7381 m…)."),
v(5,"Time de coração","A, B, C…",0,"times são categorias, sem ordem entre eles."),
v(6,"Temperatura","21,5 °C; 23,1 °C…",3,"a temperatura é medida e pode ter qualquer valor decimal (21,5 °C; 23,1 °C…)."),
v(7,"Estado civil","solteiro, casado, divorciado…",0,"solteiro, casado e divorciado são categorias sem ordem natural."),
v(8,"Satisfação com o atendimento","ruim, regular, bom, ótimo",1,"ruim, regular, bom e ótimo são categorias com ordem de satisfação."),
v(9,"Número de gols em uma partida","0, 1, 2, 3…",2,"os gols são contados: 0, 1, 2, 3…"),
v(10,"Peso","58,4 kg; 72,1 kg…",3,"o peso é medido e pode ter qualquer valor decimal (58,4 kg; 72,1 kg…)."),
v(11,"Número de alunos por sala","25, 30, 32…",2,"os alunos são contados: não existe 30,5 alunos."),
v(12,"Faixa etária","criança, adolescente, adulto, idoso",1,"criança, adolescente, adulto e idoso são categorias com ordem de idade.")
];
const GRADED=Q.filter(q=>q.k!=="reflect").length;
let i=0,score=0,att=0,tot=0,hits=0,miss=false,res=[],order=[],checked=false;
const hint=q=>`<p><b>Dica:</b> ${q.h||"releia o enunciado com calma."}</p>`;
let found=[],sel=null;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const norm=s=>s.trim().toLowerCase().replace(/[−–]/g,"-").replace(",",".").replace(/\s+/g,"");

function shuffle(a){let b;do{b=a.slice().sort(()=>Math.random()-.5)}while(b.every((x,j)=>x===a[j]));return b}

function rail(){
  let h="";
  Q.forEach((_,n)=>{
    if(n)h+=`<b class="${n<=i?"done":""}"></b>`;
    h+=`<i class="${n<i?"done":n===i?"now":""}">${n<i?"✓":n+1}</i>`;
  });
  $("#rail").innerHTML=h;
}

function render(){
  rail();checked=false;att=0;miss=false;
  const q=Q[i],c=$("#card");
  let h=`<h2>${q.title}</h2>`;
  if(q.text)h+=`<p>${q.text}</p>`;
  if(q.expr)h+=`<div class="seq">${q.expr}</div>`;
  if(q.defs)h=h.replace("</h2>",`</h2><div class="boxes">${q.defs.map(d=>`<span>${d}</span>`).join("")}</div>`);
  if(q.boxes)h=h.replace("</h2>",`</h2><div class="boxes">${(Array.isArray(q.boxes)?q.boxes:[["A",10],["B",3],["C",7]]).map(b=>`<span>Caixa ${b[0]} = <b>${b[1]}</b></span>`).join("")}</div>`);
  if(q.k==="order"){
    order=shuffle(q.items);
    h+=`<ol class="ord" id="ord"></ol>`;
  }else if(q.k==="words"){
    found=[];sel=null;
    h+=`<div class="wl" id="wl"></div><div class="grid" id="grid"></div><p class="wm" id="wm"></p>`;
  }else if(q.k==="choice"){
    order=q.fixed?q.opts.slice():shuffle(q.opts);
    h+=`<div class="opts" role="radiogroup">${order.map((t,n)=>`<label class="opt"><input type="radio" name="o" value="${n}"><span>${t}</span></label>`).join("")}</div>`;
  }else{
    if(q.seq)h+=`<div class="seq">${q.seq[0]} <em>?</em></div>`;
    h+=`<input type="text" id="inp" autocomplete="off" aria-label="Sua resposta" placeholder="Sua resposta">`;
  }
  h+=`<div id="fb"></div><div class="row"><button id="go">Conferir</button></div>`;
  c.innerHTML=h;
  if(q.k==="order")drawOrder();
  if(q.k==="words")drawGrid();
  $("#go").onclick=check;
  document.querySelectorAll("input[name=o]").forEach(x=>x.onchange=()=>{document.querySelectorAll(".opt.no").forEach(l=>l.classList.remove("no"));$("#fb").innerHTML=""});
  const inp=$("#inp");
  if(inp&&q.k==="text"){inp.focus({preventScroll:true});inp.onkeydown=e=>{if(e.key==="Enter")(checked?next:check)()}}
}

function drawOrder(mark){
  const ol=$("#ord");
  ol.innerHTML=order.map((t,n)=>`<li draggable="${!checked}" data-n="${n}" class="${mark?(t===Q[i].items[n]?"ok":"no"):""}"><span class="n">${n+1}</span><span class="t">${t}</span>${checked?"":`<span class="mv"><button class="ghost" data-m="-1" aria-label="Subir: ${t}" ${n===0?"disabled":""}>▲</button><button class="ghost" data-m="1" aria-label="Descer: ${t}" ${n===order.length-1?"disabled":""}>▼</button></span>`}</li>`).join("");
  if(checked)return;
  ol.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const n=+b.closest("li").dataset.n,m=n+ +b.dataset.m;
    [order[n],order[m]]=[order[m],order[n]];drawOrder();
    ol.querySelectorAll("li")[m].querySelector(`button[data-m="${b.dataset.m}"]:not(:disabled)`)?.focus();
  });
  let from=null;
  ol.querySelectorAll("li").forEach(li=>{
    li.ondragstart=()=>{from=+li.dataset.n;li.classList.add("drag")};
    li.ondragend=()=>li.classList.remove("drag");
    li.ondragover=e=>e.preventDefault();
    li.ondrop=e=>{e.preventDefault();const to=+li.dataset.n;if(from===null||from===to)return;const [x]=order.splice(from,1);order.splice(to,0,x);drawOrder()};
  });
}

function drawGrid(){
  const q=Q[i],own={};
  found.forEach((f,k)=>f.cells.forEach(([r,c])=>own[r+","+c]=k));
  $("#grid").innerHTML=G.map((row,r)=>row.map((ch,c)=>{const k=own[r+","+c],on=sel&&sel[0]===r&&sel[1]===c;return `<button class="cell${on?" on":""}"${k!==undefined?` style="background:hsl(${WH[k]} 70% 55% / .5)"`:""} data-r="${r}" data-c="${c}" aria-label="${ch}, linha ${r+1}, coluna ${c+1}">${ch}</button>`}).join("")).join("");
  $("#grid").querySelectorAll(".cell").forEach(b=>b.onclick=()=>pick(+b.dataset.r,+b.dataset.c));
  $("#wl").innerHTML=q.words.map(w=>{const k=found.findIndex(f=>f.w===w);return `<span class="${k>=0?"f":""}"${k>=0?` style="background:hsl(${WH[k]} 70% 55% / .5)"`:""}>${w[0]+w.slice(1).toLowerCase()}</span>`}).join("");
}
function pick(r,c){
  if(checked)return;
  const m=$("#wm");
  if(!sel){sel=[r,c];drawGrid();$("#wm").textContent="Agora toque na última letra da palavra.";return}
  const [r0,c0]=sel,dr=r-r0,dc=c-c0,n=Math.max(Math.abs(dr),Math.abs(dc));sel=null;
  if(dr&&dc&&Math.abs(dr)!==Math.abs(dc)){drawGrid();$("#wm").textContent="Selecione em linha reta: horizontal, vertical ou diagonal.";return}
  const cells=[];for(let k=0;k<=n;k++)cells.push([r0+(n?dr/n:0)*k,c0+(n?dc/n:0)*k]);
  const t=cells.map(([a,b])=>G[a][b]).join(""),w=Q[i].words.find(x=>x===t||x===[...t].reverse().join(""));
  let msg;
  if(w&&!found.some(f=>f.w===w)){found.push({w,cells});msg="Achou: "+w[0]+w.slice(1).toLowerCase()+"!"}
  else msg=w?"Essa palavra já foi marcada.":"Essa sequência não é uma das palavras.";
  drawGrid();$("#wm").textContent=msg;
}
function check(){
  if(checked)return next();
  const q=Q[i];let ok=null,fb="";
  if(q.k==="order"){
    ok=order.every((t,n)=>t===q.items[n]);att++;
    if(ok)checked=true;
    drawOrder(true);
    fb=ok?`<div class="fb ok"><b>Correto!</b><p>${q.exp}</p></div>`
      :`<div class="fb no"><b>Ainda não.</b> Os passos em vermelho estão fora do lugar. Reordene e confira de novo.${hint(q)}</div>`;
  }else if(q.k==="words"){
    att++;ok=found.length===q.words.length;
    if(ok){checked=true;drawGrid()}
    fb=ok?`<div class="fb ok"><b>Correto!</b><p>${q.exp}</p></div>`
      :`<div class="fb no"><b>Ainda não.</b> Você achou ${found.length} de ${q.words.length} palavras.${hint(q)}</div>`;
  }else if(q.k==="choice"){
    const s=document.querySelector("input[name=o]:checked");
    if(!s){$("#fb").innerHTML=`<div class="fb no">Escolha uma alternativa antes de conferir.</div>`;return}
    ok=order[+s.value]===q.opts[q.a];att++;
    const lab=s.closest("label");
    const lock=()=>document.querySelectorAll("input[name=o]").forEach(x=>x.disabled=true);
    if(ok){checked=true;lock();lab.classList.add("ok")}
    else if(att>=2){
      miss=true;checked=true;lock();s.checked=false;lab.classList.add("no");
      document.querySelectorAll(".opt")[order.indexOf(q.opts[q.a])].classList.add("ok");
    }else{lab.classList.add("no");s.checked=false}
    fb=ok?`<div class="fb ok"><b>Correto!</b><p>${q.exp}</p></div>`
      :miss?`<div class="fb no"><b>Não foi dessa vez.</b> A resposta certa é <b>${q.opts[q.a]}</b>.<p>${q.exp}</p></div>`
      :`<div class="fb no"><b>Ainda não.</b> Escolha outra alternativa.${hint(q)}</div>`;
  }else{
    const v=$("#inp").value;
    if(!v.trim()){$("#fb").innerHTML=`<div class="fb no">Digite uma resposta antes de conferir.</div>`;$("#inp").focus();return}
    ok=q.a.includes(norm(v));att++;
    if(ok){checked=true;$("#inp").disabled=true}else{$("#inp").select()}
    fb=ok?`<div class="fb ok"><b>Correto!</b><p>${q.exp}</p></div>`
      :`<div class="fb no"><b>Ainda não.</b> Tente de novo.${hint(q)}</div>`;
  }
  if(ok||miss){res.push({m:miss,t:q.title+(q.seq?" — "+q.seq[0]+" ?":q.k==="choice"?" — "+(q.v||q.expr||q.text).replace(/<[^>]+>/g,""):""),n:att});tot+=att;if(ok)hits++;if(ok&&att===1)score++}
  $("#fb").innerHTML=fb;
  if(ok===false&&!miss)return;
  $("#go").textContent=i===Q.length-1?"Ver resultado":"Próxima";
  $("#go").focus();
}

function next(){i++;i<Q.length?render():finish()}

function finish(){
  i=Q.length;rail();
  const p=score/GRADED;
  const msg=p===1?"Perfeito! Você classificou todas as variáveis corretamente.":p>=.7?"Muito bom! Falta pouco para acertar tudo.":p>=.4?"Bom começo. Revise os padrões e tente de novo.":"Vale rever a lógica de cada passo e tentar novamente.";
  $("#card").innerHTML=`<h2>Resultado</h2><div class="big">${hits}/${GRADED}</div><p>acertos. Tentativas no total: <b>${tot}</b> (mínimo possível: ${GRADED}). Acertos de primeira: <b>${score}/${GRADED}</b>${GRADED-hits?`. Não acertou: <b>${GRADED-hits}</b>`:""}.</p><p>${msg}</p>
  <ul class="rev">${res.map(r=>`<li><span class="ic ${r.m?"no":"ok"}">${r.m?"✗":r.n===1?"✓":"↻"}</span><span>${esc(r.t)} — ${r.m?"errou (2 tentativas)":"acertou em "+r.n+(r.n===1?" tentativa":" tentativas")}</span></li>`).join("")}</ul>
  <div class="row"><button id="again">Refazer o quiz</button></div>`;
  $("#again").onclick=()=>{i=0;score=0;tot=0;hits=0;res=[];render()};
}
render();
</script>
</body>
</html>

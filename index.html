<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="assets/imgs/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de Lógica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--bg:#f2f5fa;--card:#fff;--ink:#162036;--muted:#5a6781;--acc:#0e8f7e;--accink:#fff;--line:#d5dcea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--ink:#eaf0fb;--muted:#9fb0cf;--acc:#38c9b4;--accink:#06211c;--line:#2b3a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18223a;--ink:#eaf0fb;--muted:#9fb0cf;--acc:#38c9b4;--accink:#06211c;--line:#2b3a5c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px;font-weight:800}
.sub{color:var(--muted);margin:0 0 22px}
section{margin:0 0 26px}
h2{font-size:1.1rem;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 small{font-weight:700;color:var(--muted);font-size:.85rem}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
a.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:inherit;text-decoration:none}
a.item:hover{border-color:var(--acc)}
a.item:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.n{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;font-weight:800;flex:none}
.t{flex:1;min-width:0}
.t b{display:block;font-weight:800}
.t span{color:var(--muted);font-size:.92rem}
.go{color:var(--acc);font-weight:800;font-size:1.3rem}
@media (prefers-reduced-motion:no-preference){a.item{transition:border-color .15s}}
</style>
</head>
<body>
<main>
<h1>Quiz de Lógica</h1>
<p class="sub">Escolha um quiz para começar. Em cada etapa, só avança quem acertar.</p>
<div id="app"></div>
</main>
<script>
// Para adicionar um quiz: inclua um item em "quizzes". Para uma categoria nova: inclua um objeto em CATS.
const CATS=[
{nome:"Lógica de programação",quizzes:[
{titulo:"Pensamento sequencial",desc:"Ordenar passos, reflexões, sequências e caixas · 15 questões",url:"quiz_01.html"},
{titulo:"Lógica de programação 1",desc:"Caça-palavras, sequências, proposições e V ou F · 15 questões",url:"quiz_02.html"}
]},
,
{nome:"Matemática",quizzes:[
{titulo:"Conjuntos numéricos",desc:"Arrastar 16 números para naturais, inteiros, racionais e irracionais · números sorteados",url:"quiz_mat_01.html"},
{titulo:"Comparações",desc:"Completar com maior, menor ou igual: frações, decimais, porcentagens, potências e raízes · 12 questões",url:"quiz_mat_02.html"}
]}
];
document.getElementById("app").innerHTML=CATS.map(c=>`<section><h2>${c.nome} <small>${c.quizzes.length} ${c.quizzes.length===1?"quiz":"quizzes"}</small></h2><ol class="list">${c.quizzes.map((q,n)=>`<li><a class="item" href="${q.url}" target="_blank" rel="noopener"><span class="n">${n+1}</span><span class="t"><b>${q.titulo}</b><span>${q.desc}</span></span><span class="go" aria-hidden="true">→</span></a></li>`).join("")}</ol></section>`).join("");
</script>
</body>
</html>
